# PF-03: nginx trước php-fpm — nén gzip, cache tĩnh dài hạn (file có ?v= / tên có hash), ETag, HTTP/2 khi bật TLS.
# Bật TLS: gắn chứng chỉ vào /etc/nginx/certs và bỏ chú thích khối 443 cuối file.

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format travela_json escape=json '{"time":"$time_iso8601","requestId":"$req_id","ip":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream":"$upstream_response_time","ua":"$http_user_agent"}';

upstream php_app {
    server app:9000;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 14m;
    server_tokens off;

    access_log /dev/stdout travela_json;
    error_log /dev/stderr warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;
    # brotli: cần ảnh nginx có module ngx_brotli (vd fholzer/nginx-brotli); bật thì bỏ chú thích
    # brotli on; brotli_comp_level 5; brotli_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Asset tĩnh: CSS/JS/ảnh/font. URL đổi khi nội dung đổi (?v=, tên có hash) -> cache 1 năm, immutable.
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|ico)$ {
        etag on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    # Ảnh tải lên (tour, điểm đến, avatar): có thể bị thay cùng tên -> cache ngắn hơn, vẫn có ETag để trả 304
    location ~* \.(?:jpe?g|png|gif|webp|avif)$ {
        etag on;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_app;
        # KHÔNG bật fastcgi_keep_conn / keepalive tới php-fpm: mỗi kết nối giữ chết một tiến trình php-fpm, khi số kết nối nhàn rỗi
        # của nginx vượt pm.max_children thì request mới nằm chờ trên kết nối chưa được nhận -> treo 60 giây (đo được ở J1, lần chạy đầu).
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_REQUEST_ID $req_id;
        # nginx là cửa vào: ghi đè IP khách, không tin X-Forwarded-For do trình duyệt tự gửi (chống giả IP để lách giới hạn lượt)
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # trạng thái php-fpm cho healthcheck nội bộ, không mở ra ngoài
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass php_app;
    }

    location ~ /\.(?!well-known) { deny all; }
}

